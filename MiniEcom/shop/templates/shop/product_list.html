<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>

<body>

<h1>Products</h1>

<a href="{% url 'product_create' %}">
    Add Product
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Stock</th>
    </tr>

    {% for product in products %}

    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.stock }}</td>

        <td>

            <a href="{% url 'product_update' product.id %}">
                Edit
            </a>

            |

            <a href="{% url 'product_delete' product.id %}">
                Delete
            </a>

        </td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="6">
            No customers found.
        </td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
