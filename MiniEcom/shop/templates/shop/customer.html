<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>
</head>

<body>

<h1>Customers</h1>

<a href="{% url 'customer_create' %}">
    Add Customer
</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
    </tr>

    {% for customer in customers %}

    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone_number }}</td>
        <td>{{ customer.address.label.tag }}</td>

        <td>

            <a href="{% url 'customer_update' customer.id %}">
                Edit
            </a>

            |

            <a href="{% url 'customer_delete' customer.id %}">
                Delete
            </a>

        </td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="6">
            No customers found.
        </td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
